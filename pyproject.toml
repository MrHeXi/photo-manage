[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-manage-gpt"
version = "0.2.0"
description = "Windows-first desktop app for organizing photos and removing duplicate files."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.0",
    "Send2Trash>=1.8",
]

[tool.setuptools.packages.find]
include = ["photo_dedupe*"]

[tool.setuptools.package-data]
photo_dedupe = ["assets/*.ico", "assets/*.png", "assets/*.svg", "assets/*.txt"]
